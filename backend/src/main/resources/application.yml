spring:
  application:
    name: no-pain-please-api
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  cors:
    allowed-origin: ${API_CORS_ALLOWED_ORIGIN:http://localhost:4200}
